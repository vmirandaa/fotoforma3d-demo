<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f4ee">
  <meta name="description" content="Panel privado de reservas de FORMA.">
  <title>Reservas | FORMA</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600&family=Fraunces:opsz,wght@9..144,500&family=Manrope:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
</head>
<body id="top" class="admin-page">
  <!-- Aplica el modo oscuro antes de dibujar la página, para que no se vea un destello claro al abrirla (js/main.js lo mantiene después). -->
  <script>(function () { document.documentElement.classList.add('js'); var saved = null; try { saved = localStorage.getItem('forma-theme'); } catch (e) {} if (saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.dataset.mode = 'dark'; var meta = document.querySelector('meta[name=theme-color]'); if (meta) meta.content = '#171b18'; } })();</script>
  <header class="header">
    <div class="container header-inner">
      <a class="wordmark" href="index.html" aria-label="FORMA, inicio"><span class="brand-symbol" aria-hidden="true">F</span>FORMA<span class="wordmark-dot">.</span></a>
      <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Menú</button>
      <nav class="nav" aria-label="Principal">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18z" fill="currentColor"/></svg><span id="theme-label">Modo oscuro</span></button>
        <button class="theme-toggle" id="admin-logout" type="button" hidden>Salir</button>
      </nav>
    </div>
  </header>
  <main class="admin-main">
    <div class="container">
      <section class="admin-login" id="admin-login" hidden>
        <h1>Reservas</h1>
        <p class="admin-message" id="login-message" role="status" aria-live="polite">Revisando tu sesión…</p>
        <a class="button button-dark" href="ingresar.html#admin">Ingresar como administrador</a>
      </section>

      <section class="admin-board" id="admin-board" hidden>
        <div class="admin-heading">
          <h1>Reservas</h1>
          <button class="button button-light" id="admin-refresh" type="button">Actualizar</button>
        </div>
        <div class="admin-stats" id="admin-stats"></div>
        <div class="admin-tools">
          <div class="admin-filters" id="admin-filters" role="group" aria-label="Filtrar por estado"></div>
          <label class="admin-search"><span class="visually-hidden">Buscar reservas</span><input id="admin-search" type="search" autocomplete="off" placeholder="Buscar por nombre, correo, código o mascota"></label>
        </div>
        <p class="admin-message" id="board-message" role="status" aria-live="polite"></p>
        <p class="admin-count" id="admin-count"></p>
        <div class="admin-orders" id="admin-orders"></div>
      </section>
    </div>
  </main>

  <dialog class="model-dialog" id="model-dialog" aria-labelledby="model-dialog-title">
    <div class="model-dialog-head">
      <h2 id="model-dialog-title"></h2>
      <button class="theme-toggle" id="model-close" type="button">Cerrar</button>
    </div>
    <div class="model-dialog-stage">
      <model-viewer id="admin-viewer" loading="eager" camera-controls touch-action="pan-y" shadow-intensity="1.1" exposure="1" environment-image="neutral" interaction-prompt="none" alt="Modelo 3D de la reserva"></model-viewer>
      <p class="model-dialog-status" id="model-dialog-status" role="status" aria-live="polite"></p>
      <div class="photo-strip model-photos" id="model-photos" aria-label="Fotos del cliente" hidden></div>
    </div>
    <div class="model-dialog-actions">
      <div class="model-finish" role="group" aria-label="Acabado">
        <button type="button" id="view-white" aria-pressed="true">En blanco, como se imprime</button>
        <button type="button" id="view-color" aria-pressed="false">Con sus colores</button>
      </div>
      <button type="button" id="view-download">Descargar modelo</button>
    </div>
  </dialog>

  <dialog class="model-dialog photo-dialog" id="photo-dialog" aria-labelledby="photo-dialog-title">
    <div class="model-dialog-head">
      <h2 id="photo-dialog-title"></h2>
      <button class="theme-toggle" id="photo-close" type="button">Cerrar</button>
    </div>
    <div class="photo-dialog-stage">
      <button class="photo-step" id="photo-prev" type="button" aria-label="Foto anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <img id="photo-image" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="1" height="1" alt="Foto enviada por el cliente">
      <button class="photo-step" id="photo-next" type="button" aria-label="Foto siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
  </dialog>
  <script src="js/demo-api.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
